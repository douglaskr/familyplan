<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78a986"><link rel="manifest" href="manifest.webmanifest"><title>우리가족 플래너</title><style>:root{--g:#78a986;--bg:#f5f2e9;--card:#fffdf8;--ink:#253029;--muted:#7a847d;--line:#e4ded1;--yellow:#fff1b8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dcebdc 0 150px,var(--bg) 150px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:20px 14px 90px}.hero h1{margin:8px 0 4px;font-size:29px}.hero p{margin:0 0 18px;color:#53645a}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #52604e18}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{font-size:18px;margin:0}.btn{border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;padding:10px 13px}.btn.ghost{background:#edf2eb;color:var(--ink)}.btn.red{background:#c96660}.notice{background:var(--yellow);border-radius:15px;padding:13px;margin-top:10px}.notice p{margin:7px 0}.small,.muted{font-size:13px;color:var(--muted)}.rsvp{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.rsvp button{border:0;border-radius:999px;padding:8px 10px}.yes{background:#dff1e2}.no{background:#f8dedd}.maybe{background:#e9e5f6}.summary{font-size:13px;margin-top:9px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:var(--muted);padding:5px}.day{border:0;border-radius:11px;background:#f8f5ee;min-height:58px;padding:6px;text-align:left}.day.today{outline:2px solid var(--g)}.day.sel{background:#dfeadd}.dot{display:inline-block;width:6px;height:6px;background:var(--g);border-radius:50%}.birthday{font-size:10px;margin-top:3px}.event,.member{padding:11px 0;border-top:1px solid var(--line)}.event:first-child,.member:first-child{border-top:0}.event strong{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#fffdf8ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.tabs button{width:min(25%,190px);border:0;background:none;padding:12px 4px;color:var(--muted)}.tabs .active{color:var(--g);font-weight:800}.view{display:none}.view.active{display:block}.empty{text-align:center;color:var(--muted);padding:18px}dialog{border:0;border-radius:20px;width:min(92vw,560px);padding:0}dialog::backdrop{background:#15201966}.dlg{padding:18px}.close{border:0;border-radius:50%;width:34px;height:34px}.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.monthnav button{border:0;border-radius:10px;padding:8px 12px}@media(max-width:430px){.row{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="hero"><h1>🏡 우리가족 플래너</h1><p>사진 없이 공지와 일정을 간단하게 공유해요.</p></header><section id="home" class="view active"><div class="card"><div class="head"><h2>📢 가족 공지</h2><button class="btn" onclick="openNotice()">공지 작성</button></div><div id="notices"></div></div><div class="card"><div class="head"><h2>⏰ 다가오는 일정</h2><button class="btn ghost" onclick="askNotify()">알림 켜기</button></div><div id="upcoming"></div></div><div class="card"><div class="head"><h2>🎂 이번 달 생일</h2></div><div id="birthdays"></div></div></section><section id="calendar" class="view"><div class="card"><div class="monthnav"><button onclick="moveMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="moveMonth(1)">›</button></div><div id="week" class="grid"></div><div id="days" class="grid"></div></div><div class="card"><div class="head"><h2 id="dayTitle"></h2><button class="btn" onclick="openEvent()">일정 추가</button></div><div id="dayEvents"></div></div></section><section id="family" class="view"><div class="card"><div class="head"><h2>👨‍👩‍👧‍👦 가족 구성원</h2><button class="btn" onclick="openMember()">추가</button></div><div id="members"></div></div></section><section id="settings" class="view"><div class="card"><div class="head"><h2>🔔 알림</h2></div><p>상태: <strong id="notifyState"></strong></p><button class="btn" onclick="askNotify()">알림 권한 요청</button><p class="muted">현재 버전은 이 기기 안에 저장됩니다. 가족 간 실시간 공유는 다음 단계에서 Firebase로 연결합니다.</p></div></section></div><nav class="tabs"><button class="active" onclick="go('home',this)">🏠<br>홈</button><button onclick="go('calendar',this)">📅<br>달력</button><button onclick="go('family',this)">👪<br>가족</button><button onclick="go('settings',this)">⚙️<br>설정</button></nav><dialog id="noticeDlg"><form method="dialog" class="dlg" onsubmit="saveNotice(event)"><div class="head"><h2>공지 작성</h2><button class="close" value="cancel">×</button></div><div class="field"><label>제목</label><input id="nTitle" required></div><div class="field"><label>내용</label><textarea id="nBody" rows="4"></textarea></div><div class="field"><label>공지 종류</label><select id="nType"><option value="normal">일반 공지</option><option value="rsvp">참석 확인 공지</option></select></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">등록</button></div></form></dialog><dialog id="memberDlg"><form method="dialog" class="dlg" onsubmit="saveMember(event)"><div class="head"><h2>가족 등록</h2><button class="close" value="cancel">×</button></div><div class="field"><label>이름</label><input id="mName" required></div><div class="field"><label>생년월일</label><input id="mBirth" type="date" required></div><div class="field"><label>생일 기준</label><select id="mCal"><option value="solar">양력</option><option value="lunar">음력</option></select></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">저장</button></div></form></dialog><dialog id="eventDlg"><form method="dialog" class="dlg" onsubmit="saveEvent(event)"><div class="head"><h2>일정 등록</h2><button class="close" value="cancel">×</button></div><div class="field"><label>일정명</label><input id="eTitle" required></div><div class="row"><div class="field"><label>날짜</label><input id="eDate" type="date" required></div><div class="field"><label>시간</label><input id="eTime" type="time"></div></div><div class="field"><label>알림</label><select id="eReminder"><option value="none">없음</option><option value="0">정시</option><option value="60">1시간 전</option><option value="1440">1일 전</option><option value="4320">3일 전</option><option value="10080">1주 전</option></select></div><div class="field"><label>메모</label><textarea id="eMemo" rows="3"></textarea></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">저장</button></div></form></dialog><script>const K='familyplan-v1';let s=JSON.parse(localStorage.getItem(K)||'{"members":[],"notices":[],"events":[],"notified":[]}');let cur=new Date();cur.setDate(1);let sel=fmt(new Date());const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(s));function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function go(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function openNotice(){$('nTitle').value='';$('nBody').value='';$('noticeDlg').showModal()}function saveNotice(e){e.preventDefault();s.notices.unshift({id:crypto.randomUUID(),title:$('nTitle').value,body:$('nBody').value,type:$('nType').value,responses:{},created:new Date().toISOString()});save();$('noticeDlg').close();render()}function respond(nid,status){if(!s.members.length)return alert('먼저 가족 구성원을 등록해주세요.');const name=prompt('응답할 가족 이름을 입력해주세요.');const m=s.members.find(x=>x.name===name);if(!m)return alert('등록된 가족 이름과 일치하지 않습니다.');const n=s.notices.find(x=>x.id===nid);n.responses[m.id]=status;save();render()}function delNotice(id){if(confirm('공지를 삭제할까요?')){s.notices=s.notices.filter(x=>x.id!==id);save();render()}}function openMember(){$('mName').value='';$('mBirth').value='';$('memberDlg').showModal()}function saveMember(e){e.preventDefault();s.members.push({id:crypto.randomUUID(),name:$('mName').value,birth:$('mBirth').value,cal:$('mCal').value});save();$('memberDlg').close();render()}function delMember(id){if(confirm('삭제할까요?')){s.members=s.members.filter(x=>x.id!==id);save();render()}}function openEvent(){$('eTitle').value='';$('eDate').value=sel;$('eTime').value='';$('eMemo').value='';$('eventDlg').showModal()}function saveEvent(e){e.preventDefault();s.events.push({id:crypto.randomUUID(),title:$('eTitle').value,date:$('eDate').value,time:$('eTime').value,reminder:$('eReminder').value,memo:$('eMemo').value});save();sel=$('eDate').value;$('eventDlg').close();render()}function delEvent(id){if(confirm('일정을 삭제할까요?')){s.events=s.events.filter(x=>x.id!==id);save();render()}}function bday(m,y){const [,mm,dd]=m.birth.split('-');if(m.cal==='solar')return `${y}-${mm}-${dd}`;const f=new Intl.DateTimeFormat('ko-KR-u-ca-chinese',{month:'numeric',day:'numeric'});for(let d=new Date(y,0,1);d<=new Date(y,11,31);d.setDate(d.getDate()+1)){const p=f.formatToParts(d),mo=+p.find(x=>x.type==='month')?.value,da=+p.find(x=>x.type==='day')?.value;if(mo===+mm&&da===+dd)return fmt(d)}return null}function renderHome(){notices.innerHTML=s.notices.map(n=>{const vals=Object.values(n.responses||{}),yes=vals.filter(x=>x==='yes').length,no=vals.filter(x=>x==='no').length,maybe=vals.filter(x=>x==='maybe').length;return `<div class="notice"><strong>${n.title}</strong><p>${n.body||''}</p>${n.type==='rsvp'?`<div class="rsvp"><button class="yes" onclick="respond('${n.id}','yes')">✅ 참석</button><button class="no" onclick="respond('${n.id}','no')">❌ 불참</button><button class="maybe" onclick="respond('${n.id}','maybe')">❓ 미정</button></div><div class="summary">참석 ${yes} · 불참 ${no} · 미정 ${maybe} · 미응답 ${Math.max(0,s.members.length-vals.length)}</div>`:''}<div class="actions"><button class="btn red" onclick="delNotice('${n.id}')">삭제</button></div></div>`}).join('')||'<div class="empty">공지 없음</div>';const now=new Date(),lim=new Date();lim.setDate(now.getDate()+14);upcoming.innerHTML=s.events.filter(e=>e.date>=fmt(now)&&e.date<=fmt(lim)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="event"><strong>${e.date.slice(5)} ${e.time||'종일'} · ${e.title}</strong><span class="small">${e.memo||''}</span></div>`).join('')||'<div class="empty">다가오는 일정 없음</div>';const y=now.getFullYear(),mo=now.getMonth()+1;birthdays.innerHTML=s.members.map(m=>({m,d:bday(m,y)})).filter(x=>x.d&&+x.d.slice(5,7)===mo).map(x=>`<div class="member">🎂 ${x.m.name}<strong>${x.d.slice(5)}</strong></div>`).join('')||'<div class="empty">이번 달 생일 없음</div>'}function renderFamily(){members.innerHTML=s.members.map(m=>`<div class="member"><span>${m.name} · ${m.cal==='solar'?'양력':'음력'} ${m.birth.slice(5)}</span><button class="btn red" onclick="delMember('${m.id}')">삭제</button></div>`).join('')||'<div class="empty">구성원을 등록해주세요.</div>'}function moveMonth(n){cur.setMonth(cur.getMonth()+n);renderCal()}function renderCal(){const y=cur.getFullYear(),m=cur.getMonth();monthTitle.textContent=`${y}년 ${m+1}월`;week.innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');let d=new Date(y,m,1);d.setDate(d.getDate()-d.getDay());let h='';for(let i=0;i<42;i++){const x=new Date(d);x.setDate(d.getDate()+i);const z=fmt(x),bs=s.members.filter(mm=>bday(mm,x.getFullYear())===z),has=s.events.some(e=>e.date===z);h+=`<button class="day ${z===fmt(new Date())?'today':''} ${z===sel?'sel':''}" onclick="sel='${z}';renderCal();renderDay()">${x.getDate()}${bs.map(b=>`<div class="birthday">🎂${b.name}</div>`).join('')}${has?'<div><span class="dot"></span></div>':''}</button>`}days.innerHTML=h;renderDay()}function renderDay(){dayTitle.textContent=sel.replaceAll('-','.');dayEvents.innerHTML=s.events.filter(e=>e.date===sel).map(e=>`<div class="event"><strong>${e.time||'종일'} · ${e.title}</strong><span class="small">${e.memo||''}</span><div class="actions"><button class="btn red" onclick="delEvent('${e.id}')">삭제</button></div></div>`).join('')||'<div class="empty">일정 없음</div>'}async function askNotify(){if(!('Notification'in window))return alert('알림 미지원 브라우저입니다.');await Notification.requestPermission();render()}function check(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();s.events.forEach(e=>{if(e.reminder==='none'||!e.time)return;const t=new Date(`${e.date}T${e.time}:00`).getTime()-Number(e.reminder)*60000,key=e.id+e.date+e.reminder;if(now>=t&&now<t+60000&&!s.notified.includes(key)){new Notification('가족 일정 알림',{body:`${e.title} · ${e.date} ${e.time}`});s.notified.push(key);save()}})}function render(){renderHome();renderFamily();renderCal();notifyState.textContent=('Notification'in window)?({granted:'허용됨',denied:'차단됨',default:'미설정'}[Notification.permission]):'지원 안 함'}render();setInterval(check,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>

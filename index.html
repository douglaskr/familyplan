<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f49"><title>우리가족 플래너</title><style>:root{--g:#2f6f49;--bg:#eef1ec;--card:#ffffff;--ink:#17231c;--muted:#536158;--line:#d8ded9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#c9dfcf 0 180px,var(--bg) 180px);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--ink);font-size:16px}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:24px 14px 105px}.hero{padding:5px 6px 14px}.hero small{font-weight:900;letter-spacing:1.5px;color:#315d40}.hero h1{font-size:31px;margin:9px 0 4px;color:#14261a}.hero p{margin:0;color:#3f5145;font-weight:650}.card{background:var(--card);border:1px solid #dce3de;border-radius:22px;padding:17px;margin:13px 0;box-shadow:0 10px 28px #334c3b22}.head,.monthnav,.member{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h2{font-size:20px;margin:0;color:#14261a}.btn{border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:850;padding:11px 14px;box-shadow:0 3px 8px #285d3d33}.btn.ghost{background:#e1ece5;color:#214d31}.btn.red{background:#f8dddd;color:#9d3434;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;font-weight:900;color:#405048;padding:7px 0}.dow:first-child{color:#c73d3d}.dow:last-child{color:#2868b2}.day{position:relative;border:1px solid #d5ddd7;border-radius:12px;background:#fff;min-height:64px;padding:7px 6px;text-align:left;font-size:16px;font-weight:900;color:#17231c;box-shadow:0 1px 2px #21382a12}.day:nth-child(7n+1){color:#c63f3f}.day:nth-child(7n){color:#2c67ad}.day.blank{visibility:hidden;pointer-events:none}.day.today{outline:3px solid #2f6f49;background:#eef8f1}.day.today:after{content:'오늘';position:absolute;right:4px;top:4px;font-size:8px;background:#2f6f49;color:#fff;border-radius:8px;padding:2px 4px}.day.sel{background:#cfe4d5;outline:2px solid #234f35}.mark{display:inline-block;width:16px;height:5px;border-radius:999px;margin:5px 3px 0 0}.birthday{font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.monthnav{margin-bottom:12px}.monthnav strong{font-size:21px;color:#15271b}.monthnav button{border:1px solid #cbd8ce;border-radius:12px;padding:7px 13px;background:#e5eee7;color:#214d31;font-size:21px;font-weight:900}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{display:inline-flex;align-items:center;gap:6px;background:#edf2ee;border:1px solid #d4ddd6;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:750}.swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}.swipe::-webkit-scrollbar{display:none}.slide{flex:0 0 calc(100% - 20px);scroll-snap-align:center}.notice{background:#fff2a8;border:1px solid #ead56a;border-radius:17px;padding:15px;margin-top:12px;color:#332d13}.notice strong{font-size:17px}.notice p{margin:8px 0;line-height:1.5}.rsvp{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.rsvp button{border:1px solid #ccd4cf;border-radius:999px;padding:9px 11px;font-weight:800}.yes{background:#d9f0df}.no{background:#f5d7d7}.maybe{background:#e5def5}.summary,.small,.muted{font-size:13px;color:#536158}.summary{margin-top:9px;font-weight:700}.event,.member{padding:14px 0;border-top:1px solid var(--line)}.event:first-child,.member:first-child{border-top:0}.event strong{display:block;font-size:16px;color:#17231c}.event .small{display:block;margin-top:5px;line-height:1.45}.stay{display:inline-block;font-size:11px;font-weight:900;color:#1e5130;background:#dcecdf;border-radius:999px;padding:4px 8px;margin-left:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:850;color:#425148;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1.5px solid #cbd5ce;border-radius:13px;padding:13px;background:#fff;color:#17231c}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(calc(100% - 24px),720px);display:flex;justify-content:space-around;background:#ffffffee;backdrop-filter:blur(16px);border:1px solid #d2dbd5;border-radius:22px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 12px 32px #2e3a312e;z-index:10}.tabs button{width:24%;border:0;background:none;padding:9px 4px;color:#69766d;border-radius:15px;font-size:13px;font-weight:750}.tabs .active{color:#174d2b;font-weight:900;background:#dcecdf}.view{display:none}.view.active{display:block}.empty{text-align:center;color:#5c6960;padding:18px;background:#f1f4f1;border:1px dashed #cbd4cd;border-radius:14px;margin-top:10px;font-weight:700}dialog{border:0;border-radius:22px;width:min(92vw,560px);padding:0}dialog::backdrop{background:#15201988}.dlg{padding:19px;background:#fff}.close{border:0;border-radius:50%;width:35px;height:35px;background:#edf0ed;font-size:20px}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;background:#f1f4f1;padding:11px;border-radius:16px}.colorpick{aspect-ratio:1;border-radius:50%;border:4px solid #fff}.colorpick.active{outline:4px solid #17231c}.colorpick.used{opacity:.2;pointer-events:none}@media(max-width:430px){.row{grid-template-columns:1fr}.app{padding-left:11px;padding-right:11px}.card{border-radius:19px;padding:14px}.day{min-height:60px;padding:6px 5px;font-size:15px}.hero h1{font-size:28px}.head h2{font-size:19px}}</style></head><body><div class="app"><header class="hero"><small>FAMILY SPACE</small><h1>🏡 우리가족 플래너</h1><p>공지와 일정을 한눈에 함께 관리해요.</p></header><section id="home" class="view active"><div class="card"><div class="monthnav"><button onclick="moveHomeMonth(-1)">‹</button><strong id="homeMonthTitle"></strong><button onclick="moveHomeMonth(1)">›</button></div><div id="homeWeek" class="grid"></div><div id="homeDays" class="grid"></div><div id="homeLegend" class="legend"></div></div><div id="homeSwipe" class="swipe"><div class="card slide"><div class="head"><h2>📢 가족 공지</h2><button class="btn" onclick="openNotice()">작성</button></div><div id="notices"></div></div><div id="upcomingCard" class="card slide"><div class="head"><h2>⏰ 다가오는 일정</h2><button class="btn ghost" onclick="askNotify()">알림</button></div><div id="upcoming"></div></div><div id="birthdayCard" class="card slide"><div class="head"><h2>🎂 이번 달 생일</h2></div><div id="birthdays"></div></div></div></section><section id="calendar" class="view"><div class="card"><div class="monthnav"><button onclick="moveMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="moveMonth(1)">›</button></div><div id="week" class="grid"></div><div id="days" class="grid"></div><div id="legend" class="legend"></div></div><div class="card"><div class="head"><h2 id="dayTitle"></h2><button class="btn" onclick="openEvent()">일정 추가</button></div><div id="dayEvents"></div></div></section><section id="family" class="view"><div class="card"><div class="head"><h2>👨‍👩‍👧‍👦 가족 구성원</h2><button class="btn" onclick="openMember()">추가</button></div><div id="members"></div></div></section><section id="settings" class="view"><div class="card"><h2>🔔 알림</h2><p>상태: <strong id="notifyState"></strong></p><button class="btn" onclick="askNotify()">알림 권한 요청</button><p class="muted">현재 버전은 이 기기에 저장됩니다.</p></div></section></div><nav class="tabs"><button class="active" onclick="go('home',this)">🏠<br>홈</button><button onclick="go('calendar',this)">📅<br>달력</button><button onclick="go('family',this)">👪<br>가족</button><button onclick="go('settings',this)">⚙️<br>설정</button></nav><dialog id="noticeDlg"><form method="dialog" class="dlg" onsubmit="saveNotice(event)"><div class="head"><h2>공지 작성</h2><button class="close" value="cancel">×</button></div><div class="field"><label>제목</label><input id="nTitle" required></div><div class="field"><label>내용</label><textarea id="nBody" rows="4"></textarea></div><div class="field"><label>공지 종류</label><select id="nType"><option value="normal">일반 공지</option><option value="rsvp">참석 확인 공지</option></select></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">등록</button></div></form></dialog><dialog id="memberDlg"><form method="dialog" class="dlg" onsubmit="saveMember(event)"><div class="head"><h2>가족 등록</h2><button class="close" value="cancel">×</button></div><div class="field"><label>이름</label><input id="mName" required></div><div class="field"><label>생년월일</label><input id="mBirth" type="date" required></div><div class="field"><label>생일 기준</label><select id="mCal"><option value="solar">양력</option><option value="lunar">음력</option></select></div><div class="field"><label>달력 마킹 색상 (중복 불가)</label><div id="palette" class="palette"></div><input id="mColor" type="hidden" required></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">저장</button></div></form></dialog><dialog id="eventDlg"><form method="dialog" class="dlg" onsubmit="saveEvent(event)"><div class="head"><h2>일정 등록</h2><button class="close" value="cancel">×</button></div><div class="field"><label>일정명</label><input id="eTitle" required></div><div class="row"><div class="field"><label>시작일</label><input id="eDate" type="date" required></div><div class="field"><label>종료일</label><input id="eEndDate" type="date" required></div></div><div class="row"><div class="field"><label>시간</label><input id="eTime" type="time"></div><div class="field"><label>시간 표시</label><select id="eNoTime"><option value="false">시간 사용</option><option value="true">시간 없음</option></select></div></div><div class="field"><label>일정 담당자</label><select id="eMember" required></select></div><div class="field"><label>알림</label><select id="eReminder"><option value="none">없음</option><option value="0">정시</option><option value="60">1시간 전</option><option value="1440">1일 전</option><option value="4320">3일 전</option><option value="10080">1주 전</option></select></div><div class="field"><label>메모</label><textarea id="eMemo" rows="3"></textarea></div><div class="actions"><button class="btn ghost" value="cancel">취소</button><button class="btn">저장</button></div></form></dialog><script>const K='familyplan-v3',COLORS=['#E85D5D','#4A90E2','#58A76B','#F2C94C','#9B6ED6','#F2994A'];let old=JSON.parse(localStorage.getItem('familyplan-v2')||'null');let s=JSON.parse(localStorage.getItem(K)||JSON.stringify(old||{members:[],notices:[],events:[],notified:[]}));s.events=s.events.map(e=>({...e,endDate:e.endDate||e.date,noTime:e.noTime??!e.time}));let cur=new Date();cur.setDate(1);let homeCur=new Date(cur),sel=fmt(new Date());const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(s));function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function member(id){return s.members.find(x=>x.id===id)||{name:'미지정',color:'#999'}}function parseDate(v){return new Date(v+'T00:00:00')}function stayText(e){const days=Math.round((parseDate(e.endDate)-parseDate(e.date))/86400000)+1;return days<=1?'당일':`${days-1}박 ${days}일`}function covers(e,z){return z>=e.date&&z<=e.endDate}function go(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function openNotice(){$('nTitle').value='';$('nBody').value='';$('noticeDlg').showModal()}function saveNotice(e){e.preventDefault();s.notices.unshift({id:crypto.randomUUID(),title:$('nTitle').value,body:$('nBody').value,type:$('nType').value,responses:{}});save();$('noticeDlg').close();render()}function respond(id,status){if(!s.members.length)return alert('먼저 가족을 등록해주세요.');const name=prompt('응답할 가족 이름');const m=s.members.find(x=>x.name===name);if(!m)return alert('등록된 이름과 일치하지 않습니다.');s.notices.find(x=>x.id===id).responses[m.id]=status;save();render()}function delNotice(id){if(confirm('공지를 삭제할까요?')){s.notices=s.notices.filter(x=>x.id!==id);save();render()}}function drawPalette(){const used=s.members.map(x=>x.color);$('mColor').value='';$('palette').innerHTML=COLORS.map(c=>`<button type="button" class="colorpick ${used.includes(c)?'used':''}" style="background:${c}" onclick="pickColor('${c}',this)"></button>`).join('')}function pickColor(c,b){document.querySelectorAll('.colorpick').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('mColor').value=c}function openMember(){if(s.members.length>=6)return alert('가족은 최대 6명까지 등록할 수 있습니다.');$('mName').value='';$('mBirth').value='';drawPalette();$('memberDlg').showModal()}function saveMember(e){e.preventDefault();const color=$('mColor').value;if(!color)return alert('색상을 선택해주세요.');if(s.members.some(x=>x.color===color))return alert('이미 사용 중인 색상입니다.');s.members.push({id:crypto.randomUUID(),name:$('mName').value,birth:$('mBirth').value,cal:$('mCal').value,color});save();$('memberDlg').close();render()}function delMember(id){if(confirm('가족을 삭제할까요?')){s.members=s.members.filter(x=>x.id!==id);s.events=s.events.filter(x=>x.memberId!==id);save();render()}}function openEvent(){if(!s.members.length)return alert('먼저 가족을 등록해주세요.');$('eTitle').value='';$('eDate').value=sel;$('eEndDate').value=sel;$('eTime').value='';$('eNoTime').value='true';$('eMemo').value='';$('eMember').innerHTML=s.members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');$('eventDlg').showModal()}function saveEvent(e){e.preventDefault();if($('eEndDate').value<$('eDate').value)return alert('종료일은 시작일보다 빠를 수 없습니다.');s.events.push({id:crypto.randomUUID(),title:$('eTitle').value,date:$('eDate').value,endDate:$('eEndDate').value,time:$('eTime').value,noTime:$('eNoTime').value==='true',memberId:$('eMember').value,reminder:$('eReminder').value,memo:$('eMemo').value});save();sel=$('eDate').value;$('eventDlg').close();render()}function delEvent(id){if(confirm('일정을 삭제할까요?')){s.events=s.events.filter(x=>x.id!==id);save();render()}}function bday(m,y){const [,mm,dd]=m.birth.split('-');if(m.cal==='solar')return `${y}-${mm}-${dd}`;const f=new Intl.DateTimeFormat('ko-KR-u-ca-chinese',{month:'numeric',day:'numeric'});for(let d=new Date(y,0,1);d<=new Date(y,11,31);d.setDate(d.getDate()+1)){const p=f.formatToParts(d),mo=+p.find(x=>x.type==='month')?.value,da=+p.find(x=>x.type==='day')?.value;if(mo===+mm&&da===+dd)return fmt(d)}return null}function calHTML(base,titleId,weekId,daysId,legendId){const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$(titleId).textContent=`${y}년 ${m+1}월`;$(weekId).innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');let h='';for(let i=0;i<first;i++)h+='<button class="day blank"></button>';for(let d=1;d<=last;d++){const x=new Date(y,m,d),z=fmt(x),bs=s.members.filter(mm=>bday(mm,y)===z),es=s.events.filter(e=>covers(e,z));h+=`<button class="day ${z===fmt(new Date())?'today':''} ${z===sel?'sel':''}" onclick="sel='${z}';render();">${d}${bs.map(b=>`<div class="birthday" style="color:${b.color}">🎂${b.name}</div>`).join('')}<div>${es.slice(0,6).map(e=>`<span class="mark" style="background:${member(e.memberId).color}"></span>`).join('')}</div></button>`}$(daysId).innerHTML=h;$(legendId).innerHTML=s.members.map(m=>`<span class="chip"><span class="mark" style="background:${m.color}"></span>${m.name}</span>`).join('')}function moveMonth(n){cur.setMonth(cur.getMonth()+n);render()}function moveHomeMonth(n){homeCur.setMonth(homeCur.getMonth()+n);render()}function renderHome(){calHTML(homeCur,'homeMonthTitle','homeWeek','homeDays','homeLegend');$('notices').innerHTML=s.notices.map(n=>{const v=Object.values(n.responses||{});return `<div class="notice"><strong>${n.title}</strong><p>${n.body||''}</p>${n.type==='rsvp'?`<div class="rsvp"><button class="yes" onclick="respond('${n.id}','yes')">✅ 참석</button><button class="no" onclick="respond('${n.id}','no')">❌ 불참</button><button class="maybe" onclick="respond('${n.id}','maybe')">❓ 미정</button></div><div class="summary">참석 ${v.filter(x=>x==='yes').length} · 불참 ${v.filter(x=>x==='no').length} · 미정 ${v.filter(x=>x==='maybe').length}</div>`:''}<div class="actions"><button class="btn red" onclick="delNotice('${n.id}')">삭제</button></div></div>`}).join('')||'<div class="empty">공지 없음</div>';const now=fmt(new Date()),lim=new Date();lim.setDate(lim.getDate()+14);const up=s.events.filter(e=>e.endDate>=now&&e.date<=fmt(lim)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('upcomingCard').style.display=up.length?'block':'none';$('upcoming').innerHTML=up.map(e=>{const m=member(e.memberId);return `<div class="event"><strong><span class="mark" style="background:${m.color}"></span>${e.date.slice(5)}${e.endDate!==e.date?'~'+e.endDate.slice(5):''} · ${e.title}<span class="stay">${stayText(e)}</span></strong><span class="small">${m.name} · ${e.noTime?'시간 없음':e.time||'종일'}</span></div>`}).join('');const d=new Date(),y=d.getFullYear(),mo=d.getMonth()+1,bs=s.members.map(m=>({m,d:bday(m,y)})).filter(x=>x.d&&+x.d.slice(5,7)===mo);$('birthdayCard').style.display=bs.length?'block':'none';$('birthdays').innerHTML=bs.map(x=>`<div class="member"><span><span class="mark" style="background:${x.m.color}"></span>🎂 ${x.m.name}</span><strong>${x.d.slice(5)}</strong></div>`).join('')}function renderFamily(){$('members').innerHTML=s.members.map(m=>`<div class="member"><span><span class="mark" style="background:${m.color}"></span>${m.name} · ${m.cal==='solar'?'양력':'음력'} ${m.birth.slice(5)}</span><button class="btn red" onclick="delMember('${m.id}')">삭제</button></div>`).join('')||'<div class="empty">가족을 등록해주세요.</div>'}function renderDay(){$('dayTitle').textContent=sel.replaceAll('-','.');const es=s.events.filter(e=>covers(e,sel));$('dayEvents').innerHTML=es.map(e=>{const m=member(e.memberId);return `<div class="event"><strong><span class="mark" style="background:${m.color}"></span>${e.title}<span class="stay">${stayText(e)}</span></strong><span class="small">${m.name} · ${e.date}${e.endDate!==e.date?' ~ '+e.endDate:''} · ${e.noTime?'시간 없음':e.time||'종일'}</span><div class="actions"><button class="btn red" onclick="delEvent('${e.id}')">삭제</button></div></div>`}).join('')||'<div class="empty">일정 없음</div>'}async function askNotify(){if(!('Notification'in window))return alert('알림 미지원 브라우저입니다.');await Notification.requestPermission();render()}function render(){renderHome();renderFamily();calHTML(cur,'monthTitle','week','days','legend');renderDay();$('notifyState').textContent=('Notification'in window)?({granted:'허용됨',denied:'차단됨',default:'미설정'}[Notification.permission]):'지원 안 함'}render();</script></body></html>
